<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Pascals Sternenhimmel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-stage="intro">
  <div class="nebula" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main id="intro" class="intro">
    <h1 id="intro-title" class="intro__title"></h1>
    <p id="intro-quote" class="intro__quote"></p>
    <button id="enter-btn" class="gold-btn" type="button"></button>
  </main>

  <!-- Erinnerungssterne (Buttons werden von memories.js erzeugt) -->
  <div id="memory-layer" class="memory-layer" hidden></div>
  <p id="progress" class="progress" aria-live="polite" hidden></p>
  <p id="sky-hint" class="sky-hint" hidden></p>
  <button id="reset-btn" class="reset-btn" type="button" hidden></button>
  <button id="music-btn" class="music-btn" type="button" aria-pressed="false" aria-label="Musik an oder aus" hidden>♪</button>

  <!-- Erinnerungsfenster -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <section class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal__close" type="button" data-close>×</button>
      <h2 id="modal-title"></h2>
      <figure id="modal-figure" class="modal__figure" hidden><img id="modal-img" alt=""></figure>
      <div id="modal-text" class="modal__text" tabindex="0"></div>
    </section>
  </div>

  <!-- Finale -->
  <section id="finale" class="finale" hidden aria-live="polite">
    <h2 id="finale-headline" class="finale__headline"></h2>
    <div id="finale-message" class="finale__message"></div>
    <button id="finale-restart" class="gold-btn" type="button"></button>
  </section>

  <noscript><p class="noscript">Für Pascals Sternenhimmel wird JavaScript benötigt.</p></noscript>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="memories.js"></script>
</body>
</html>
